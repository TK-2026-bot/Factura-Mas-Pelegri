<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FACTURA">
<title>FACTURA — Mas Pelegri</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green:    #1A7A3C;
    --green-dk: #145C2D;
    --red:      #C0212B;
    --red-dk:   #9A1A22;
    --bg:       #F0EDE6;
    --ink:      #1A1814;
    --mid:      #5A5348;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ── HEADER ── */
  .header {
    padding: calc(16px + var(--safe-top)) 24px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1.5px solid #DDD8CF;
    background: var(--bg);
  }
  .header-icon {
    width: 52px;
    height: 52px;
    background: #1B3F7A;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 900;
    color: #fff;
    flex-shrink: 0;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  .header-text {}
  .header-title {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: .06em;
    color: var(--ink);
    line-height: 1;
  }
  .header-sub {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--mid);
    margin-top: 3px;
  }

  /* ── SCREENS ── */
  .screen { display: none; flex-direction: column; flex: 1; }
  .screen.active { display: flex; }

  /* ── CHOOSE SCREEN ── */
  .choose-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 28px 20px calc(28px + var(--safe-bot));
    gap: 16px;
  }

  .choose-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--mid);
    padding: 0 4px;
  }

  .event-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    border: none;
    border-radius: 18px;
    padding: 32px 24px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .1s, opacity .1s;
  }
  .event-btn:active { transform: scale(.97); opacity: .9; }

  .event-btn.checkout { background: var(--green); }
  .event-btn.cancel   { background: var(--red); }

  .event-emoji {
    font-size: 52px;
    line-height: 1;
  }
  .event-name {
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    letter-spacing: .01em;
    text-align: center;
  }
  .event-desc {
    font-size: 15px;
    font-weight: 500;
    color: rgba(255,255,255,.75);
    text-align: center;
    line-height: 1.4;
  }

  /* ── FORM SCREEN ── */
  .form-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 20px calc(28px + var(--safe-bot));
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 16px;
    font-weight: 600;
    color: var(--mid);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 0 20px;
    -webkit-tap-highlight-color: transparent;
  }

  .form-badge {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-radius: 14px;
    margin-bottom: 28px;
  }
  .form-badge.checkout { background: var(--green); }
  .form-badge.cancel   { background: var(--red); }
  .form-badge-emoji { font-size: 28px; }
  .form-badge-name {
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    letter-spacing: .02em;
  }

  .field { display: flex; flex-direction: column; gap: 10px; }
  .field label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--mid);
  }
  .field input {
    background: #fff;
    border: 2px solid #DDD8CF;
    border-radius: 12px;
    padding: 18px 16px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--ink);
    font-family: "SF Mono", "Fira Code", monospace;
    width: 100%;
    -webkit-appearance: none;
    text-transform: uppercase;
  }
  .field input:focus {
    outline: none;
    border-color: #1B3F7A;
  }
  .field input::placeholder {
    color: #C8C2B8;
    font-weight: 400;
    letter-spacing: .04em;
  }
  .field-hint {
    font-size: 13px;
    color: var(--mid);
  }

  .status-box {
    display: none;
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
  }
  .status-box.ok  { display: block; background: #E3F2E8; color: var(--green); }
  .status-box.err { display: block; background: #FCEAEA; color: var(--red); }

  .submit-wrap {
    margin-top: auto;
    padding-top: 24px;
  }
  .submit-wrap button {
    width: 100%;
    padding: 20px;
    border: none;
    border-radius: 14px;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: .03em;
    color: #fff;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .15s;
  }
  .submit-wrap button:active { opacity: .85; }
  .submit-wrap button:disabled { opacity: .4; }
  .submit-wrap button.checkout { background: var(--green); }
  .submit-wrap button.cancel   { background: var(--red); }

  /* ── SUCCESS ── */
  .success-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px calc(40px + var(--safe-bot));
    gap: 16px;
    text-align: center;
  }
  .success-circle {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    margin-bottom: 8px;
  }
  .success-circle.checkout { background: #E3F2E8; }
  .success-circle.cancel   { background: #FCEAEA; }
  .success-title {
    font-size: 28px;
    font-weight: 900;
    color: var(--ink);
  }
  .success-ref {
    font-family: "SF Mono", monospace;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--ink);
    background: #fff;
    padding: 10px 20px;
    border-radius: 10px;
    border: 2px solid #DDD8CF;
  }
  .success-msg {
    font-size: 15px;
    color: var(--mid);
    line-height: 1.5;
    max-width: 300px;
  }
  .new-action-btn {
    margin-top: 16px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 18px 40px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-icon">F</div>
    <div class="header-text">
      <div class="header-title">FACTURA</div>
      <div class="header-sub">Hotel Mas Pelegri</div>
    </div>
  </div>

  <!-- CHOOSE -->
  <div class="screen active" id="screen-choose">
    <div class="choose-body">
      <div class="choose-label">Select action</div>

      <button class="event-btn checkout" onclick="selectEvent('checkout')">
        <div class="event-emoji">🏁</div>
        <div class="event-name">CHECK-OUT</div>
        <div class="event-desc">Guest has left — generate final invoice</div>
      </button>

      <button class="event-btn cancel" onclick="selectEvent('cancel')">
        <div class="event-emoji">✕</div>
        <div class="event-name">CANCELLATION</div>
        <div class="event-desc">Booking cancelled — void prepayment</div>
      </button>

    </div>
  </div>

  <!-- FORM -->
  <div class="screen" id="screen-form">
    <div class="form-body">

      <button class="back-btn" onclick="goBack()">‹ Back</button>

      <div class="form-badge" id="form-badge">
        <div class="form-badge-emoji" id="form-badge-emoji"></div>
        <div class="form-badge-name" id="form-badge-name"></div>
      </div>

      <div class="field">
        <label for="booking-ref">Booking reference</label>
        <input
          type="text"
          id="booking-ref"
          placeholder="XTB1AAC738"
          maxlength="10"
          autocapitalize="characters"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        >
        <div class="field-hint">10 characters — as shown in Freetobook</div>
      </div>

      <div class="status-box" id="status-box"></div>

      <div class="submit-wrap">
        <button id="submit-btn" onclick="submitForm()"></button>
      </div>

    </div>
  </div>

  <!-- SUCCESS -->
  <div class="screen" id="screen-success">
    <div class="success-body">
      <div class="success-circle" id="success-circle"></div>
      <div class="success-title" id="success-title"></div>
      <div class="success-ref" id="success-ref"></div>
      <div class="success-msg" id="success-msg"></div>
      <button class="new-action-btn" onclick="goHome()">New action</button>
    </div>
  </div>

</div>
<script>
const WEBHOOKS = {
  checkout: "https://hooks.zapier.com/hooks/catch/25538555/4u3wxpk/",
  cancel:   "https://hooks.zapier.com/hooks/catch/25538555/4u30u8s/"
};

const EVENTS = {
  checkout: {
    emoji: "🏁",
    name: "CHECK-OUT",
    btnClass: "checkout",
    btnText: "Log Check-out",
    successTitle: "Check-out logged",
    successMsg: "Zapier will generate the final invoice in Holded."
  },
  cancel: {
    emoji: "✕",
    name: "CANCELLATION",
    btnClass: "cancel",
    btnText: "Log Cancellation",
    successTitle: "Cancellation logged",
    successMsg: "Zapier will void the prepayment invoice in Holded."
  }
};

let currentEvent = null;

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function selectEvent(key) {
  currentEvent = key;
  const cfg = EVENTS[key];
  document.getElementById('form-badge').className = 'form-badge ' + cfg.btnClass;
  document.getElementById('form-badge-emoji').textContent = cfg.emoji;
  document.getElementById('form-badge-name').textContent = cfg.name;
  const btn = document.getElementById('submit-btn');
  btn.textContent = cfg.btnText;
  btn.className = cfg.btnClass;
  document.getElementById('booking-ref').value = '';
  document.getElementById('status-box').className = 'status-box';
  showScreen('screen-form');
  setTimeout(() => document.getElementById('booking-ref').focus(), 300);
}

function goBack() { showScreen('screen-choose'); }
function goHome() { showScreen('screen-choose'); }

async function submitForm() {
  const refInput = document.getElementById('booking-ref');
  const statusBox = document.getElementById('status-box');
  const btn = document.getElementById('submit-btn');
  const ref = refInput.value.trim().toUpperCase();

  if (!ref) { showStatus('err', 'Please enter a booking reference.'); return; }
  if (ref.length !== 10) { showStatus('err', 'Must be exactly 10 characters (e.g. XTB1AAC738).'); return; }

  btn.disabled = true;
  btn.textContent = 'Sending…';
  statusBox.className = 'status-box';

  try {
    await fetch(WEBHOOKS[currentEvent], {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ event_type: currentEvent, booking_ref: ref, submitted_at: new Date().toISOString() })
    });
    const cfg = EVENTS[currentEvent];
    document.getElementById('success-circle').textContent = cfg.emoji;
    document.getElementById('success-circle').className = 'success-circle ' + cfg.btnClass;
    document.getElementById('success-title').textContent = cfg.successTitle;
    document.getElementById('success-ref').textContent = ref;
    document.getElementById('success-msg').textContent = cfg.successMsg;
    showScreen('screen-success');
  } catch(err) {
    showStatus('err', 'Could not send. Check connection and try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = EVENTS[currentEvent].btnText;
  }
}

function showStatus(type, msg) {
  const box = document.getElementById('status-box');
  box.className = 'status-box ' + type;
  box.textContent = msg;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('screen-form').classList.contains('active')) submitForm();
});
</script>
</body>
</html>
