<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FACTURA">
<title>FACTURA — Mas Pelegri</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231A1814'/><text y='62' x='50' text-anchor='middle' font-size='52' font-family='Helvetica Neue,Arial' font-weight='900' fill='%23F5C842'>F</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #F5F2EC;
    --surface:  #FFFFFF;
    --ink:      #1A1814;
    --mid:      #6B6456;
    --rule:     #E2DDD4;
    --olive:    #4A5E3A;
    --olive-lt: #EBF0E6;
    --rust:     #A84A2F;
    --rust-lt:  #F5EAE6;
    --amber:    #B07A2A;
    --amber-lt: #F5EFE2;
    --radius:   10px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 0 calc(24px + var(--safe-bottom));
  }

  /* ── HEADER ── */
  .header {
    padding: 48px 24px 20px;
    border-bottom: 1px solid var(--rule);
  }
  .header-logo {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--mid);
    margin-top: 2px;
  }
  .header-title {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: .04em;
    color: var(--ink);
  }

  /* ── SCREENS ── */
  .screen { display: none; flex-direction: column; flex: 1; }
  .screen.active { display: flex; }

  /* ── CHOOSE SCREEN ── */
  .choose-body {
    padding: 28px 20px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .choose-hint {
    font-size: 13px;
    color: var(--mid);
    padding: 0 4px 4px;
  }

  .event-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border: 1.5px solid var(--rule);
    border-radius: var(--radius);
    padding: 18px 18px;
    cursor: pointer;
    text-align: left;
    transition: border-color .15s, background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .event-btn:active { background: var(--bg); }

  .event-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .event-icon.checkout  { background: var(--olive-lt); }
  .event-icon.cancel    { background: var(--rust-lt); }
  .event-icon.more      { background: var(--amber-lt); }

  .event-text {}
  .event-name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .event-desc {
    font-size: 13px;
    color: var(--mid);
    line-height: 1.4;
  }

  .event-arrow {
    margin-left: auto;
    color: var(--rule);
    font-size: 20px;
    flex-shrink: 0;
  }

  /* ── FORM SCREEN ── */
  .form-body {
    padding: 28px 20px 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
    flex: 1;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--olive);
    font-weight: 500;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    margin-bottom: 4px;
    -webkit-tap-highlight-color: transparent;
  }

  .form-event-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .form-event-badge.checkout { background: var(--olive-lt); color: var(--olive); }
  .form-event-badge.cancel   { background: var(--rust-lt);  color: var(--rust);  }
  .form-event-badge.more     { background: var(--amber-lt); color: var(--amber); }

  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--mid);
  }
  .field input {
    background: var(--surface);
    border: 1.5px solid var(--rule);
    border-radius: var(--radius);
    padding: 15px 14px;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: .06em;
    color: var(--ink);
    font-family: "SF Mono", "Fira Code", monospace;
    width: 100%;
    -webkit-appearance: none;
  }
  .field input:focus {
    outline: none;
    border-color: var(--olive);
  }
  .field input::placeholder {
    color: var(--rule);
    font-weight: 400;
    letter-spacing: .02em;
  }
  .field-hint {
    font-size: 12px;
    color: var(--mid);
  }

  .submit-btn {
    margin-top: auto;
    padding-top: 20px;
  }
  .submit-btn button {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .01em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .15s;
  }
  .submit-btn button:active { opacity: .8; }
  .submit-btn button:disabled { opacity: .4; cursor: default; }

  .submit-btn button.checkout { background: var(--olive); color: #fff; }
  .submit-btn button.cancel   { background: var(--rust);  color: #fff; }
  .submit-btn button.more     { background: var(--amber); color: #fff; }

  /* ── STATUS ── */
  .status-box {
    display: none;
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.5;
  }
  .status-box.ok  { display: block; background: var(--olive-lt); color: var(--olive); }
  .status-box.err { display: block; background: var(--rust-lt);  color: var(--rust);  }

  /* ── SUCCESS SCREEN ── */
  .success-body {
    padding: 48px 24px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 16px;
    flex: 1;
  }
  .success-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  .success-icon.checkout { background: var(--olive-lt); }
  .success-icon.cancel   { background: var(--rust-lt); }
  .success-icon.more     { background: var(--amber-lt); }
  .success-ref {
    font-family: "SF Mono", monospace;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--ink);
  }
  .success-msg {
    font-size: 15px;
    color: var(--mid);
    line-height: 1.5;
    max-width: 280px;
  }
  .success-new-btn {
    margin-top: 32px;
    background: var(--surface);
    border: 1.5px solid var(--rule);
    border-radius: var(--radius);
    padding: 14px 28px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-logo">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#1A1814"/>
        <text x="24" y="34" text-anchor="middle" font-size="26" font-family="Helvetica Neue,Arial,sans-serif" font-weight="900" fill="#F5C842">F</text>
      </svg>
      <div>
        <div class="header-title">FACTURA</div>
        <div class="header-label">Hotel Mas Pelegri</div>
      </div>
    </div>
  </div>

  <!-- ── SCREEN: CHOOSE ── -->
  <div class="screen active" id="screen-choose">
    <div class="choose-body">
      <div class="choose-hint">Select an action to log</div>

      <button class="event-btn" onclick="selectEvent('checkout')">
        <div class="event-icon checkout">🏁</div>
        <div class="event-text">
          <div class="event-name">Check-out</div>
          <div class="event-desc">Guest has left — generate final invoice</div>
        </div>
        <div class="event-arrow">›</div>
      </button>

      <button class="event-btn" onclick="selectEvent('cancel')">
        <div class="event-icon cancel">✕</div>
        <div class="event-text">
          <div class="event-name">Cancellation</div>
          <div class="event-desc">Booking cancelled by the hotel — void prepayment</div>
        </div>
        <div class="event-arrow">›</div>
      </button>

      <!-- PLACEHOLDER для будущих событий — просто добавь новый event-btn сюда -->

    </div>
  </div>

  <!-- ── SCREEN: FORM ── -->
  <div class="screen" id="screen-form">
    <div class="form-body">

      <div>
        <button class="back-btn" onclick="goBack()">‹ Back</button>
      </div>

      <div class="form-event-badge" id="form-badge"></div>

      <div class="field">
        <label for="booking-ref">Booking reference</label>
        <input
          type="text"
          id="booking-ref"
          placeholder="XTB1AAC738"
          maxlength="10"
          autocapitalize="characters"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        >
        <div class="field-hint">As shown in Freetobook — 10 characters</div>
      </div>

      <div class="status-box" id="status-box"></div>

      <div class="submit-btn">
        <button id="submit-btn" onclick="submitForm()">Send</button>
      </div>

    </div>
  </div>

  <!-- ── SCREEN: SUCCESS ── -->
  <div class="screen" id="screen-success">
    <div class="success-body">
      <div class="success-icon" id="success-icon"></div>
      <div class="success-ref" id="success-ref"></div>
      <div class="success-msg" id="success-msg"></div>
      <button class="success-new-btn" onclick="goHome()">New action</button>
    </div>
  </div>

</div>

<script>
// ── WEBHOOK URLS ──────────────────────────────────────────────
// Replace with real Zapier Catch Hook URLs once Zaps are created
const WEBHOOKS = {
  checkout: "https://hooks.zapier.com/hooks/catch/25538555/4u3wxpk/",
  cancel:   "https://hooks.zapier.com/hooks/catch/25538555/4u30u8s/",
  // Add future events here:
  // event_key: "https://hooks.zapier.com/hooks/catch/..."
};

// ── EVENT CONFIG ──────────────────────────────────────────────
const EVENTS = {
  checkout: {
    icon: "🏁",
    label: "Check-out",
    btnClass: "checkout",
    successMsg: "Check-out logged. Zapier will generate the final invoice in Holded."
  },
  cancel: {
    icon: "✕",
    label: "Cancellation",
    btnClass: "cancel",
    successMsg: "Cancellation logged. Zapier will void the prepayment invoice in Holded."
  }
  // Add future events here
};

// ── STATE ─────────────────────────────────────────────────────
let currentEvent = null;

// ── NAVIGATION ────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function selectEvent(key) {
  currentEvent = key;
  const cfg = EVENTS[key];

  // Badge
  const badge = document.getElementById('form-badge');
  badge.textContent = cfg.icon + '  ' + cfg.label;
  badge.className = 'form-event-badge ' + cfg.btnClass;

  // Submit button
  const btn = document.getElementById('submit-btn');
  btn.textContent = 'Log ' + cfg.label;
  btn.className = cfg.btnClass;

  // Clear previous state
  document.getElementById('booking-ref').value = '';
  document.getElementById('status-box').className = 'status-box';
  document.getElementById('status-box').textContent = '';

  showScreen('screen-form');
  setTimeout(() => document.getElementById('booking-ref').focus(), 300);
}

function goBack() {
  showScreen('screen-choose');
}

function goHome() {
  showScreen('screen-choose');
}

// ── SUBMIT ────────────────────────────────────────────────────
async function submitForm() {
  const refInput = document.getElementById('booking-ref');
  const statusBox = document.getElementById('status-box');
  const btn = document.getElementById('submit-btn');

  const ref = refInput.value.trim().toUpperCase();

  // Validate
  if (!ref) {
    showStatus('err', 'Please enter a booking reference.');
    return;
  }
  if (ref.length !== 10) {
    showStatus('err', 'Booking reference must be exactly 10 characters (e.g. XTB1AAC738).');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending…';
  statusBox.className = 'status-box';

  const payload = {
    event_type:  currentEvent,
    booking_ref: ref,
    submitted_at: new Date().toISOString()
  };

  const url = WEBHOOKS[currentEvent];

  try {
    await fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    // Show success screen
    const cfg = EVENTS[currentEvent];
    document.getElementById('success-icon').textContent = cfg.icon;
    document.getElementById('success-icon').className = 'success-icon ' + cfg.btnClass;
    document.getElementById('success-ref').textContent = ref;
    document.getElementById('success-msg').textContent = cfg.successMsg;
    showScreen('screen-success');

  } catch (err) {
    showStatus('err', 'Could not send. Check your connection and try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Log ' + EVENTS[currentEvent].label;
  }
}

function showStatus(type, msg) {
  const box = document.getElementById('status-box');
  box.className = 'status-box ' + type;
  box.textContent = msg;
}

// ── ENTER KEY ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('screen-form').classList.contains('active')) {
    submitForm();
  }
});
</script>
</body>
</html>
